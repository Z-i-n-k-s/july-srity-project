<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Memorial illustration for Wasim Akram</title>
  <desc id="desc">An abstract archival memorial illustration using the Bangladesh flag, candlelight and documentary motifs. It is not a photographic portrait.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10131C"/><stop offset=".58" stop-color="#21151F"/><stop offset="1" stop-color="#080A11"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#B96776" stop-opacity=".52"/><stop offset="1" stop-color="#B96776" stop-opacity="0"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="11"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .09"/></feComponentTransfer></filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <circle cx="940" cy="185" r="270" fill="url(#halo)"/>
  <circle cx="208" cy="700" r="290" fill="#D79A54" opacity=".11"/>
  <path d="M0 655 C220 555 410 765 650 630 C850 515 990 570 1200 470 V900 H0Z" fill="#F4F1EA" opacity=".045"/>
  <g transform="translate(140 145)">
    <circle cx="250" cy="250" r="205" fill="#0B4F3D" opacity=".92"/>
    <circle cx="307" cy="250" r="78" fill="#D3353B"/>
    <circle cx="250" cy="250" r="221" fill="none" stroke="#F4F1EA" stroke-opacity=".16" stroke-width="2"/>
    <text x="250" y="281" text-anchor="middle" fill="#F4F1EA" font-family="Georgia,serif" font-size="102" font-weight="700">WA</text>
  </g>
  <g transform="translate(720 298)" fill="none" stroke-linecap="round">
    <path d="M70 270V95" stroke="#F4F1EA" stroke-opacity=".5" stroke-width="18"/>
    <path d="M70 95C25 150 36 194 70 210C106 191 117 148 70 95Z" fill="#B96776" stroke="none" opacity=".9"/>
    <path d="M20 270H120" stroke="#F4F1EA" stroke-opacity=".35" stroke-width="10"/>
    <path d="M195 54h160M195 105h210M195 156h130M195 207h185" stroke="#F4F1EA" stroke-opacity=".18" stroke-width="10"/>
  </g>
  <g fill="#F4F1EA">
    <text x="90" y="752" font-family="Georgia,serif" font-size="61" font-weight="700">Wasim Akram</text>
    <text x="93" y="810" font-family="Arial,sans-serif" font-size="26" opacity=".72">Chattogram • 16 July 2024</text>
    <text x="1090" y="810" text-anchor="end" font-family="Arial,sans-serif" font-size="21" opacity=".45">MEMORIAL ILLUSTRATION</text>
  </g>
  <rect width="1200" height="900" filter="url(#grain)"/>
</svg>